spring.application.name=Hotel-Reservation-Sysyem-For-Weddings
# MySQL Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/wedding_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Sliit@123

# JPA (Java Persistence API) Settings
# This tells Hibernate (the JPA provider) to automatically create/update the database schema
# based on your Entity classes. 'update' is great for development.
spring.jpa.hibernate.ddl-auto=update

# This shows the actual SQL queries in the console, which is very helpful for debugging.
spring.jpa.show-sql=true
# Add this line to ensure the correct engine is used
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
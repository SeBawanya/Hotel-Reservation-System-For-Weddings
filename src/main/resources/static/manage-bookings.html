<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Bookings</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .modal-backdrop { background-color: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); }
        .toast { transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out; }
        .modal-content { transform: scale(0.95); opacity: 0; transition: all 0.2s ease-in-out; }
        .modal-content.show { transform: scale(1); opacity: 1; }
    </style>
</head>
<body class="antialiased">

<header class="bg-white sticky top-0 z-40 border-b border-slate-200">
    <div class="container mx-auto px-4 lg:px-8">
        <div class="flex justify-between items-center py-3">
            <a href="index.html"><img src="images/LinkedinArtboard 3.png" alt="Golden-Palm Logo" class="h-14"></a>
            <div class="flex items-center space-x-6">
                <a href="/admin-dashboard.html" class="text-sm font-semibold text-slate-600 hover:text-amber-600"><i class="fas fa-arrow-left mr-2"></i>Back to Dashboard</a>
                <a href="/logout" class="text-slate-500 hover:text-amber-600" title="Logout"><i class="fas fa-sign-out-alt text-2xl"></i></a>
            </div>
        </div>
    </div>
</header>

<main class="container mx-auto px-4 lg:px-8 py-8 md:py-12">
    <div class="mb-10">
        <h1 class="text-3xl font-bold text-slate-800">Wedding Bookings</h1>
        <p class="mt-1 text-slate-500">View, edit, and manage all confirmed wedding bookings.</p>
    </div>
    <div id="booking-list" class="space-y-6"></div>
</main>

<div id="edit-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden p-4">
    <div class="modal-content bg-white rounded-lg shadow-xl w-full max-w-lg">
        <div class="p-4 border-b flex justify-between items-center">
            <h2 class="text-xl font-semibold">Edit Booking</h2>
            <button class="close-modal-btn text-gray-400 hover:text-gray-600">&times;</button>
        </div>
        <form id="edit-booking-form" class="p-6 space-y-4">
            <input type="hidden" id="edit-booking-id">
            <div>
                <label for="edit-booking-date" class="block text-sm font-medium text-slate-600 mb-1">Event Date</label>
                <input type="date" id="edit-booking-date" class="w-full border border-slate-300 rounded-lg shadow-sm py-2 px-3 focus:ring-2 focus:ring-amber-500">
            </div>
            <div>
                <label for="edit-ballroom-select" class="block text-sm font-medium text-slate-600 mb-1">Ballroom</label>
                <select id="edit-ballroom-select" class="w-full border border-slate-300 rounded-lg shadow-sm py-2 px-3 focus:ring-2 focus:ring-amber-500">
                    <option>Loading...</option>
                </select>
            </div>
            <div class="pt-2 flex justify-end space-x-3">
                <button type="button" class="close-modal-btn bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg">Cancel</button>
                <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-4 rounded-lg">Save Changes</button>
            </div>
        </form>
    </div>
</div>
<div id="delete-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden p-4">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 text-center p-8">
        <div class="mx-auto bg-red-100 w-16 h-16 rounded-full flex items-center justify-center mb-4"><i class="fas fa-exclamation-triangle text-3xl text-red-500"></i></div>
        <h2 class="text-xl font-semibold text-slate-800 mb-2">Confirm Cancellation</h2>
        <p class="text-slate-600 mb-6">Are you sure you want to cancel the booking for <span id="delete-booking-name" class="font-bold"></span> on <span id="delete-booking-date" class="font-bold"></span>?</p>
        <div class="flex justify-center space-x-4"><button id="cancel-delete-btn" class="bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-2.5 px-6 rounded-lg">Keep Booking</button><button id="confirm-delete-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-6 rounded-lg">Cancel Booking</button></div>
    </div>
</div>

<div id="toast" class="fixed top-5 right-5 z-[100] text-white py-3 px-6 rounded-lg shadow-lg opacity-0 transform translate-y-[-20px] toast"><p id="toast-message"></p></div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const API_URL = '/api/bookings';
        const bookingList = document.getElementById('booking-list');
        const deleteModal = document.getElementById('delete-modal');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');
        let bookingToDeleteId = null;
        let bookings = [];
        let allBallrooms = [];

        // START: New element references for edit modal
        const editModal = document.getElementById('edit-modal');
        const editBookingForm = document.getElementById('edit-booking-form');
        const editBookingIdInput = document.getElementById('edit-booking-id');
        const editDateInput = document.getElementById('edit-booking-date');
        const editBallroomSelect = document.getElementById('edit-ballroom-select');
        // END: New element references

        const showToast = (message, isError = false) => {
            toastMessage.textContent = message;
            toast.className = `fixed top-5 right-5 z-[100] text-white py-3 px-6 rounded-lg shadow-lg opacity-0 transform translate-y-[-20px] toast ${isError ? 'bg-red-500' : 'bg-green-600'}`;
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => toast.classList.add('opacity-0', 'translate-y-[-20px]'), 3000);
        };

        const openModal = (modal) => {
            modal.classList.remove('hidden');
            setTimeout(() => modal.querySelector('.modal-content').classList.add('show'), 10);
        };
        const closeModal = (modal) => {
            modal.querySelector('.modal-content').classList.remove('show');
            setTimeout(() => modal.classList.add('hidden'), 200);
        };

        const formatDate = (dateString) => new Date(dateString).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

        // START: New functions for edit feature
        async function loadBallrooms() {
            try {
                const res = await fetch('/api/bookings/ballrooms');
                if(!res.ok) throw new Error("Could not load ballrooms.");
                allBallrooms = await res.json();
            } catch (error) {
                showToast(error.message, true);
            }
        }

        function populateBallroomSelect(selectElement, selectedId) {
            selectElement.innerHTML = '';
            allBallrooms.forEach(b => {
                const option = document.createElement('option');
                option.value = b.id;
                option.textContent = b.name;
                if (b.id == selectedId) option.selected = true;
                selectElement.appendChild(option);
            });
        }
        // END: New functions for edit feature

        const renderBookings = () => {
            bookingList.innerHTML = '';
            if (bookings.length === 0) {
                bookingList.innerHTML = `<div class="text-center py-12 bg-slate-100 rounded-xl border-2 border-dashed border-slate-200"><div class="mx-auto bg-amber-100 w-16 h-16 rounded-full flex items-center justify-center mb-4"><i class="fas fa-calendar-check text-3xl text-amber-500"></i></div><h3 class="text-xl font-semibold text-slate-700">No Bookings Found</h3><p class="text-slate-500 mt-1">There are currently no confirmed wedding bookings.</p></div>`;
                return;
            }
            bookings.forEach(b => {
                const card = document.createElement('div');
                card.className = 'booking-card bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden';
                card.dataset.id = b.id;
                card.innerHTML = `
                <div class="p-6 grid grid-cols-1 md:grid-cols-4 gap-6 items-start">
                    <div class="md:col-span-1">
                        <h3 class="font-bold text-slate-800 text-lg">${b.customer.name}</h3>
                        <p class="text-sm text-slate-500">${b.customer.email}</p>
                        <p class="text-sm text-slate-500">${b.customer.phone || 'N/A'}</p>
                        <div class="mt-4 bg-amber-100 text-amber-800 font-bold text-center rounded-full px-3 py-1.5 text-sm booking-date">${formatDate(b.bookingDate)}</div>
                    </div>
                    <div class="md:col-span-2">
                        <div class="flex items-center text-slate-600 mb-2">
                            <i class="fas fa-place-of-worship w-5 text-center mr-3 text-slate-400"></i>
                            <span class="font-semibold">Venue:</span>
                            <span class="ml-2 booking-ballroom">${b.ballroom.name}</span>
                        </div>
                         <div class="flex items-center text-slate-600">
                            <i class="fas fa-box-open w-5 text-center mr-3 text-slate-400"></i>
                            <span class="font-semibold">Package:</span>
                            <span class="ml-2">${b.weddingPackage.name}</span>
                        </div>
                    </div>
                    <div class="md:col-span-1 text-left md:text-right space-y-3">
                        <div>
                            <p class="text-xs text-slate-500 font-medium">TOTAL PRICE</p>
                            <p class="text-2xl font-bold text-slate-800">${b.totalPrice.toLocaleString()}</p>
                        </div>
                        <div class="flex md:flex-col lg:flex-row justify-start md:items-end pt-2 space-x-3 md:space-x-0 lg:space-x-3 md:space-y-2 lg:space-y-0">
                             <button class="edit-btn text-sm font-semibold text-blue-600 hover:text-blue-800 transition" data-booking='${JSON.stringify(b)}'><i class="fas fa-pencil-alt mr-1"></i> Edit</button>
                             <button class="cancel-btn text-sm font-semibold text-red-600 hover:text-red-800 transition" data-id="${b.id}" data-name="${b.customer.name}" data-date="${formatDate(b.bookingDate)}"><i class="fas fa-times-circle mr-1"></i> Cancel</button>
                        </div>
                    </div>
                </div>`;
                bookingList.appendChild(card);
            });
        };

        const fetchBookings = async () => {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Failed to fetch bookings');
                bookings = await response.json();
                bookings.sort((a, b) => new Date(a.bookingDate) - new Date(b.bookingDate));
                renderBookings();
            } catch (error) {
                showToast(error.message, true);
            }
        };

        bookingList.addEventListener('click', (e) => {
            const cancelBtn = e.target.closest('.cancel-btn');
            if (cancelBtn) {
                bookingToDeleteId = cancelBtn.dataset.id;
                document.getElementById('delete-booking-name').textContent = cancelBtn.dataset.name;
                document.getElementById('delete-booking-date').textContent = cancelBtn.dataset.date;
                openModal(deleteModal);
            }
            // START: New event listener for edit button
            const editBtn = e.target.closest('.edit-btn');
            if (editBtn) {
                const bookingData = JSON.parse(editBtn.dataset.booking);
                editBookingIdInput.value = bookingData.id;
                editDateInput.value = bookingData.bookingDate;
                populateBallroomSelect(editBallroomSelect, bookingData.ballroom.id);
                openModal(editModal);
            }
            // END: New event listener
        });

        document.getElementById('cancel-delete-btn').addEventListener('click', () => closeModal(deleteModal));
        document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
            if (!bookingToDeleteId) return;
            try {
                const response = await fetch(`${API_URL}/${bookingToDeleteId}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Failed to cancel booking');
                showToast('Booking Canceled Successfully!');
                closeModal(deleteModal);
                fetchBookings();
            } catch (error) { showToast(error.message, true); }
            finally { bookingToDeleteId = null; }
        });

        // START: New listener for edit form submission
        editBookingForm.addEventListener('submit', async(e) => {
            e.preventDefault();
            const bookingId = editBookingIdInput.value;
            const updatedData = {
                bookingDate: editDateInput.value,
                ballroomId: editBallroomSelect.value
            };
            try {
                const response = await fetch(`/api/bookings/${bookingId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedData)
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.message || "Failed to update booking.");

                showToast("Booking updated successfully!");
                fetchBookings(); // Refresh the entire list to show changes
            } catch (error) {
                showToast(error.message, true);
            } finally {
                closeModal(editModal);
            }
        });
        // END: New listener

        document.querySelectorAll('.close-modal-btn').forEach(btn => {
            btn.addEventListener('click', () => closeModal(btn.closest('.modal-backdrop')));
        });

        fetchBookings();
        loadBallrooms();
    });
</script>

</body>
</html>

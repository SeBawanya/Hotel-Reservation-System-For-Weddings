<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Manage Users</title>
  <link rel="icon" href="images/LinkedinArtboard 1.png" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }
    .toast {
      transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
    }
    input:focus, select:focus {
      --tw-ring-color: #f59e0b;
    }
    .modal-backdrop {
      background-color: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
    }
    .modal-content {
      transform: scale(0.95);
      opacity: 0;
      transition: all 0.2s ease-in-out;
    }
    .modal-content.show {
      transform: scale(1);
      opacity: 1;
    }
  </style>
</head>
<body class="antialiased">

<header class="bg-white sticky top-0 z-40 border-b border-slate-200">
  <div class="container mx-auto px-4 lg:px-8">
    <div class="flex justify-between items-center py-3">
      <a href="index.html">
        <img src="images/LinkedinArtboard 3.png" alt="Golden-Palm Logo" class="h-14">
      </a>
      <div class="flex items-center space-x-6">
        <a href="/admin-dashboard.html" class="text-sm font-semibold text-slate-600 hover:text-amber-600">
          <i class="fas fa-arrow-left mr-2"></i>Back to Dashboard
        </a>
        <a href="/logout" class="text-slate-500 hover:text-amber-600" title="Logout">
          <i class="fas fa-sign-out-alt text-2xl"></i>
        </a>
      </div>
    </div>
  </div>
</header>

<main class="container mx-auto px-4 lg:px-8 py-8 md:py-12">
  <div class="mb-10">
    <h1 class="text-3xl font-bold text-slate-800">Manage Admin Users</h1>
    <p class="mt-1 text-slate-500">Add, edit, and manage staff members and their roles.</p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="lg:col-span-1">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-semibold text-slate-800 mb-4 border-b pb-3">Add New Admin</h2>
        <form id="add-admin-form" class="space-y-4">
          <div>
            <label for="name" class="block text-sm font-medium text-slate-600 mb-1">Full Name</label>
            <input type="text" id="name" name="name" class="w-full border border-slate-300 rounded-lg shadow-sm py-2 px-3 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" required>
          </div>
          <div>
            <label for="email" class="block text-sm font-medium text-slate-600 mb-1">Email Address</label>
            <input type="email" id="email" name="email" class="w-full border border-slate-300 rounded-lg shadow-sm py-2 px-3 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" required>
          </div>
          <div>
            <label for="password" class="block text-sm font-medium text-slate-600 mb-1">Password</label>
            <input type="password" id="password" name="password" class="w-full border border-slate-300 rounded-lg shadow-sm py-2 px-3 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" required>
          </div>
          <div>
            <label for="role" class="block text-sm font-medium text-slate-600 mb-1">Assign Role</label>
            <select id="role" name="role" class="w-full border border-slate-300 rounded-lg shadow-sm py-2 px-3 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" required>
              <option value="">Select a role...</option>
              <option value="ROLE_RECEPTIONIST">Receptionist</option>
              <option value="ROLE_COORDINATOR">Coordinator</option>
              <option value="ROLE_HOTEL_MANAGER">Hotel Manager</option>
              <option value="ROLE_IT_OFFICER">IT Officer</option>
            </select>
          </div>
          <div class="pt-2">
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 px-6 rounded-lg transition-transform duration-200 hover:scale-105 shadow-sm">Create Admin Account</button>
          </div>
        </form>
      </div>
    </div>

    <div class="lg:col-span-2">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200">
        <table class="w-full text-left">
          <thead class="border-b border-slate-200">
          <tr>
            <th class="p-4 text-sm font-semibold text-slate-600">Name</th>
            <th class="p-4 text-sm font-semibold text-slate-600">Email</th>
            <th class="p-4 text-sm font-semibold text-slate-600">Role</th>
            <th class="p-4 text-sm font-semibold text-slate-600 text-right">Actions</th>
          </tr>
          </thead>
          <tbody id="admin-table-body">
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div id="edit-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden p-4">
  <div class="modal-content bg-white rounded-lg shadow-xl w-full max-w-md">
    <div class="p-4 border-b flex justify-between items-center">
      <h2 class="text-xl font-semibold">Edit Admin User</h2>
      <button class="close-modal-btn text-gray-400 hover:text-gray-600">&times;</button>
    </div>
    <form id="edit-admin-form" class="p-6 space-y-4">
      <input type="hidden" id="edit-admin-id">
      <div>
        <label for="edit-name" class="block text-sm font-medium text-slate-600 mb-1">Full Name</label>
        <input type="text" id="edit-name" class="w-full border border-slate-300 rounded-lg shadow-sm py-2 px-3 focus:ring-2 focus:ring-amber-500" required>
      </div>
      <div>
        <label for="edit-email" class="block text-sm font-medium text-slate-600 mb-1">Email Address</label>
        <input type="email" id="edit-email" class="w-full border border-slate-300 rounded-lg shadow-sm py-2 px-3 focus:ring-2 focus:ring-amber-500" required>
      </div>
      <div>
        <label for="edit-role" class="block text-sm font-medium text-slate-600 mb-1">Assign Role</label>
        <select id="edit-role" class="w-full border border-slate-300 rounded-lg shadow-sm py-2 px-3 focus:ring-2 focus:ring-amber-500" required>
          <option value="ROLE_RECEPTIONIST">Receptionist</option>
          <option value="ROLE_COORDINATOR">Coordinator</option>
          <option value="ROLE_HOTEL_MANAGER">Hotel Manager</option>
          <option value="ROLE_IT_OFFICER">IT Officer</option>
        </select>
      </div>
      <div class="pt-2 flex justify-end space-x-3">
        <button type="button" class="close-modal-btn bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg">Cancel</button>
        <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-4 rounded-lg">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<div id="delete-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden p-4">
  <div class="modal-content bg-white rounded-lg shadow-xl w-full max-w-md text-center p-6">
    <div class="mx-auto bg-red-100 w-16 h-16 rounded-full flex items-center justify-center mb-4">
      <i class="fas fa-exclamation-triangle text-3xl text-red-500"></i>
    </div>
    <h2 class="text-xl font-semibold">Confirm Deletion</h2>
    <p class="text-gray-600 my-4">Are you sure you want to delete the user <strong id="delete-admin-name"></strong>? This action cannot be undone.</p>
    <div class="flex justify-center space-x-3">
      <button type="button" class="close-modal-btn bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg">Cancel</button>
      <button id="confirm-delete-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg">Yes, Delete</button>
    </div>
  </div>
</div>
<div id="toast" class="fixed top-5 right-5 z-[100] bg-green-500 text-white py-3 px-6 rounded-lg shadow-lg opacity-0 transform translate-y-[-20px] toast">
  <p id="toast-message"></p>
</div>

<script>
  document.addEventListener('DOMContentLoaded', async () => {

    const adminTableBody = document.getElementById('admin-table-body');
    const addAdminForm = document.getElementById('add-admin-form');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toast-message');

    const editModal = document.getElementById('edit-modal');
    const editAdminForm = document.getElementById('edit-admin-form');
    const editAdminId = document.getElementById('edit-admin-id');
    const editName = document.getElementById('edit-name');
    const editEmail = document.getElementById('edit-email');
    const editRole = document.getElementById('edit-role');

    // START: New element references for delete modal
    const deleteModal = document.getElementById('delete-modal');
    const deleteAdminName = document.getElementById('delete-admin-name');
    const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
    let adminToDeleteId = null;
    // END: New element references

    // Security check
    try {
      const statusResponse = await fetch('/api/users/status');
      if (!statusResponse.ok) throw new Error('Not authenticated');
      const user = await statusResponse.json();
      if (!user.isAuthenticated || user.userType !== 'ADMIN' || user.role !== 'ROLE_IT_OFFICER') {
        window.location.href = '/admin-dashboard.html';
        return;
      }
    } catch (error) {
      window.location.href = '/login.html';
      return;
    }

    const showToast = (message, isError = false) => {
      toastMessage.textContent = message;
      toast.className = `fixed top-5 right-5 z-[100] text-white py-3 px-6 rounded-lg shadow-lg opacity-0 transform translate-y-[-20px] toast ${isError ? 'bg-red-500' : 'bg-green-600'}`;
      toast.classList.remove('opacity-0', 'translate-y-[-20px]');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-[-20px]');
      }, 3000);
    };

    const openModal = (modal) => {
      modal.classList.remove('hidden');
      setTimeout(() => modal.querySelector('.modal-content').classList.add('show'), 10);
    };
    const closeModal = (modal) => {
      modal.querySelector('.modal-content').classList.remove('show');
      setTimeout(() => modal.classList.add('hidden'), 200);
    };

    const renderAdmins = (admins) => {
      adminTableBody.innerHTML = '';
      if (!admins || admins.length === 0) {
        adminTableBody.innerHTML = `<tr><td colspan="4" class="text-center p-8 text-slate-500">No admin users found.</td></tr>`;
        return;
      }
      admins.forEach(admin => {
        const row = document.createElement('tr');
        row.className = 'border-b border-slate-200 last:border-b-0';
        row.innerHTML = `
            <td class="p-4 font-medium text-slate-800">${admin.name}</td>
            <td class="p-4 text-slate-600">${admin.email}</td>
            <td class="p-4 text-slate-600">${admin.role.replace('ROLE_', '').replace('_', ' ')}</td>
            <td class="p-4 text-right space-x-4">
                <button class="edit-btn text-sm font-semibold text-blue-600 hover:text-blue-800 transition"
                    data-id="${admin.id}" data-name="${admin.name}" data-email="${admin.email}" data-role="${admin.role}">
                    <i class="fas fa-pencil-alt mr-1"></i> Edit
                </button>
                <button class="delete-btn text-sm font-semibold text-red-600 hover:text-red-800 transition"
                    data-id="${admin.id}" data-name="${admin.name}">
                    <i class="fas fa-trash-alt mr-1"></i> Delete
                </button>
            </td>
        `;
        adminTableBody.appendChild(row);
      });
    };

    const fetchAdmins = async () => {
      try {
        const response = await fetch('/api/admins');
        if (!response.ok) throw new Error('Failed to fetch admin users.');
        const admins = await response.json();
        renderAdmins(admins);
      } catch (error) {
        showToast(error.message, true);
      }
    };

    addAdminForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const adminData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        role: document.getElementById('role').value
      };
      if (!adminData.name || !adminData.email || !adminData.password || !adminData.role) {
        showToast('All fields are required.', true);
        return;
      }
      try {
        const response = await fetch('/api/admins', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(adminData)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Failed to create account.');
        showToast('Admin user created successfully!');
        addAdminForm.reset();
        fetchAdmins();
      } catch (error) {
        showToast(error.message, true);
      }
    });

    adminTableBody.addEventListener('click', (e) => {
      const editBtn = e.target.closest('.edit-btn');
      if (editBtn) {
        editAdminId.value = editBtn.dataset.id;
        editName.value = editBtn.dataset.name;
        editEmail.value = editBtn.dataset.email;
        editRole.value = editBtn.dataset.role;
        openModal(editModal);
      }
      // START: New listener for delete button
      const deleteBtn = e.target.closest('.delete-btn');
      if(deleteBtn) {
        adminToDeleteId = deleteBtn.dataset.id;
        deleteAdminName.textContent = deleteBtn.dataset.name;
        openModal(deleteModal);
      }
      // END: New listener
    });

    editAdminForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = editAdminId.value;
      const updatedAdmin = {
        name: editName.value,
        email: editEmail.value,
        role: editRole.value
      };
      try {
        const response = await fetch(`/api/admins/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updatedAdmin)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Failed to update admin.');
        showToast('Admin updated successfully!');
        closeModal(editModal);
        fetchAdmins();
      } catch (error) {
        showToast(error.message, true);
      }
    });

    // START: New listener for delete confirmation
    confirmDeleteBtn.addEventListener('click', async () => {
      if (!adminToDeleteId) return;
      try {
        const response = await fetch(`/api/admins/${adminToDeleteId}`, {
          method: 'DELETE'
        });
        if (!response.ok) {
          const result = await response.json();
          throw new Error(result.message || 'Failed to delete user.');
        }
        showToast('Admin user deleted successfully!');
        closeModal(deleteModal);
        fetchAdmins();
      } catch(error) {
        showToast(error.message, true);
      } finally {
        adminToDeleteId = null;
      }
    });
    // END: New listener

    // Add listeners for all close buttons on modals
    document.querySelectorAll('.close-modal-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        closeModal(btn.closest('.modal-backdrop'));
      });
    });

    fetchAdmins();
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Golden Palm</title>
    <link rel="icon" href="images/LinkedinArtboard 1.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .toast {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        .modal-backdrop {
            background-color: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
        }
        .modal-content {
            transform: scale(0.95);
            opacity: 0;
            transition: all 0.2s ease-in-out;
        }
        .modal-content.show {
            transform: scale(1);
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-50">

<header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="container mx-auto px-4 lg:px-8">
        <div class="flex justify-between items-center py-3">
            <a href="index.html">
                <img src="images/LinkedinArtboard 3.png" alt="Golden-Palm Logo" class="h-14">
            </a>
            <a href="index.html" class="text-sm font-semibold text-gray-600 hover:text-amber-600">
                <i class="fas fa-home mr-2"></i>Back to Home
            </a>
        </div>
    </div>
</header>

<main class="container mx-auto px-4 lg:px-8 py-12">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 border-b pb-4 mb-8">My Profile</h1>

        <div id="loading-spinner" class="text-center py-12">
            <i class="fas fa-spinner fa-spin text-4xl text-amber-500"></i>
            <p class="mt-2 text-gray-600">Loading your profile...</p>
        </div>

        <!-- Profile Display Section -->
        <div id="profile-display" class="hidden bg-white p-8 rounded-lg shadow-sm border border-gray-200 space-y-6">
            <div class="space-y-4">
                <div>
                    <p class="text-sm font-medium text-slate-500">Full Name</p>
                    <p id="display-name" class="text-lg text-slate-800"></p>
                </div>
                <div>
                    <p class="text-sm font-medium text-slate-500">Email Address</p>
                    <p id="display-email" class="text-lg text-slate-800"></p>
                </div>
                <div>
                    <p class="text-sm font-medium text-slate-500">Phone Number</p>
                    <p id="display-phone" class="text-lg text-slate-800"></p>
                </div>
            </div>
            <div class="border-t pt-6 flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-4">
                <button id="edit-profile-btn" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-4 rounded-lg transition">Edit Profile</button>
                <button id="change-password-btn" class="w-full bg-slate-700 hover:bg-slate-800 text-white font-bold py-2 px-4 rounded-lg transition">Change Password</button>
                <button id="delete-account-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition">Delete Account</button>
            </div>
        </div>
    </div>
</main>

<!-- Edit Profile Modal -->
<div id="edit-profile-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden p-4">
    <div class="modal-content bg-white rounded-lg shadow-xl w-full max-w-md">
        <div class="p-4 border-b flex justify-between items-center">
            <h2 class="text-xl font-semibold">Edit Profile</h2>
            <button class="close-modal-btn text-gray-400 hover:text-gray-600">&times;</button>
        </div>
        <form id="profile-form" class="p-6 space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-slate-600 mb-1">Full Name</label>
                <input type="text" id="name" name="name" class="w-full border border-slate-300 rounded-lg shadow-sm py-2 px-3 focus:ring-2 focus:ring-amber-500" required>
            </div>
            <div>
                <label for="phone" class="block text-sm font-medium text-slate-600 mb-1">Phone Number</label>
                <input type="tel" id="phone" name="phone" class="w-full border border-slate-300 rounded-lg shadow-sm py-2 px-3 focus:ring-2 focus:ring-amber-500" required>
            </div>
            <div class="pt-2 flex justify-end space-x-3">
                <button type="button" class="close-modal-btn bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg">Cancel</button>
                <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-4 rounded-lg">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<!-- Change Password Modal -->
<div id="change-password-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden p-4">
    <div class="modal-content bg-white rounded-lg shadow-xl w-full max-w-md">
        <div class="p-4 border-b flex justify-between items-center">
            <h2 class="text-xl font-semibold">Change Password</h2>
            <button class="close-modal-btn text-gray-400 hover:text-gray-600">&times;</button>
        </div>
        <form id="password-form" class="p-6 space-y-4">
            <div>
                <label for="current-password" class="block text-sm font-medium text-slate-600 mb-1">Current Password</label>
                <input type="password" id="current-password" class="w-full border border-slate-300 rounded-lg shadow-sm py-2 px-3 focus:ring-2 focus:ring-amber-500" required>
            </div>
            <div>
                <label for="new-password" class="block text-sm font-medium text-slate-600 mb-1">New Password</label>
                <input type="password" id="new-password" class="w-full border border-slate-300 rounded-lg shadow-sm py-2 px-3 focus:ring-2 focus:ring-amber-500" required>
            </div>
            <div>
                <label for="confirm-password" class="block text-sm font-medium text-slate-600 mb-1">Confirm New Password</label>
                <input type="password" id="confirm-password" class="w-full border border-slate-300 rounded-lg shadow-sm py-2 px-3 focus:ring-2 focus:ring-amber-500" required>
            </div>
            <div class="pt-2 flex justify-end space-x-3">
                <button type="button" class="close-modal-btn bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg">Cancel</button>
                <button type="submit" class="bg-slate-700 hover:bg-slate-800 text-white font-bold py-2 px-4 rounded-lg">Update Password</button>
            </div>
        </form>
    </div>
</div>

<!-- Delete Account Modal -->
<div id="delete-account-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden p-4">
    <div class="modal-content bg-white rounded-lg shadow-xl w-full max-w-md text-center p-6">
        <div class="mx-auto bg-red-100 w-16 h-16 rounded-full flex items-center justify-center mb-4">
            <i class="fas fa-exclamation-triangle text-3xl text-red-500"></i>
        </div>
        <h2 class="text-xl font-semibold">Delete Account</h2>
        <p class="text-gray-600 my-4">Are you sure? This action is permanent and cannot be undone. All your bookings will be cancelled.</p>
        <div class="flex justify-center space-x-3">
            <button type="button" class="close-modal-btn bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg">Cancel</button>
            <button id="confirm-delete-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg">Yes, Delete My Account</button>
        </div>
    </div>
</div>


<!-- Toast Notification -->
<div id="toast" class="fixed top-5 right-5 z-[100] text-white py-3 px-6 rounded-lg shadow-lg opacity-0 transform translate-y-[-20px] toast">
    <p id="toast-message"></p>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- Page Elements ---
        const loadingSpinner = document.getElementById('loading-spinner');
        const profileDisplay = document.getElementById('profile-display');
        const displayName = document.getElementById('display-name');
        const displayEmail = document.getElementById('display-email');
        const displayPhone = document.getElementById('display-phone');

        // --- Modals & Forms ---
        const editProfileModal = document.getElementById('edit-profile-modal');
        const changePasswordModal = document.getElementById('change-password-modal');
        const deleteAccountModal = document.getElementById('delete-account-modal');
        const profileForm = document.getElementById('profile-form');
        const passwordForm = document.getElementById('password-form');

        // --- Buttons ---
        const editProfileBtn = document.getElementById('edit-profile-btn');
        const changePasswordBtn = document.getElementById('change-password-btn');
        const deleteAccountBtn = document.getElementById('delete-account-btn');
        const confirmDeleteBtn = document.getElementById('confirm-delete-btn');

        // --- Form Inputs ---
        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phone');

        // --- Toast ---
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        let currentCustomer = null;

        // --- UI HELPER FUNCTIONS ---
        const showToast = (message, isError = false) => {
            toastMessage.textContent = message;
            toast.className = `fixed top-5 right-5 z-[100] text-white py-3 px-6 rounded-lg shadow-lg opacity-0 transform translate-y-[-20px] toast ${isError ? 'bg-red-500' : 'bg-green-600'}`;
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            setTimeout(() => toast.classList.add('opacity-100', 'translate-y-0'), 10);
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
            }, 3000);
        };

        const openModal = (modal) => {
            modal.classList.remove('hidden');
            setTimeout(() => modal.querySelector('.modal-content').classList.add('show'), 10);
        };

        const closeModal = (modal) => {
            modal.querySelector('.modal-content').classList.remove('show');
            setTimeout(() => modal.classList.add('hidden'), 200);
        };

        document.querySelectorAll('.close-modal-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                closeModal(btn.closest('.modal-backdrop'));
            });
        });

        // --- DATA LOADING & DISPLAY ---
        function displayProfileData(customer) {
            currentCustomer = customer;
            displayName.textContent = customer.name;
            displayEmail.textContent = customer.email;
            displayPhone.textContent = customer.phone || 'Not provided';
        }

        async function loadProfile() {
            try {
                const response = await fetch('/api/customers/me');
                if (response.status === 401) {
                    window.location.href = 'login.html?redirect=profile.html';
                    return;
                }
                if (!response.ok) throw new Error('Could not fetch profile data.');

                const customer = await response.json();
                displayProfileData(customer);

                loadingSpinner.classList.add('hidden');
                profileDisplay.classList.remove('hidden');

            } catch (error) {
                loadingSpinner.innerHTML = `<p class="text-red-500">${error.message}</p>`;
            }
        }

        // --- EVENT LISTENERS ---

        // Open Modals
        editProfileBtn.addEventListener('click', () => {
            nameInput.value = currentCustomer.name;
            phoneInput.value = currentCustomer.phone || '';
            openModal(editProfileModal);
        });

        changePasswordBtn.addEventListener('click', () => {
            passwordForm.reset();
            openModal(changePasswordModal);
        });

        deleteAccountBtn.addEventListener('click', () => {
            openModal(deleteAccountModal);
        });

        // Form Submissions
        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const updatedData = { name: nameInput.value, phone: phoneInput.value };

            try {
                const response = await fetch('/api/customers/me/update', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedData)
                });
                if (!response.ok) throw new Error('Failed to update profile.');

                const result = await response.json();
                showToast(result.message || 'Profile updated successfully!');
                await loadProfile(); // Refresh displayed data
                closeModal(editProfileModal);
            } catch (error) {
                showToast(error.message, true);
            }
        });

        passwordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) {
                showToast('New passwords do not match.', true);
                return;
            }

            try {
                const response = await fetch('/api/customers/me/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ currentPassword, newPassword })
                });

                const result = await response.json();
                if (!response.ok) throw new Error(result.message || 'Failed to change password.');

                showToast(result.message || 'Password changed successfully!');
                closeModal(changePasswordModal);
            } catch (error) {
                showToast(error.message, true);
            }
        });

        confirmDeleteBtn.addEventListener('click', async () => {
            try {
                const response = await fetch('/api/customers/me/delete', { method: 'DELETE' });
                if (!response.ok) throw new Error('Failed to delete account.');

                showToast('Account deleted successfully. Logging out...');
                setTimeout(() => {
                    // The backend should handle logging the user out upon deletion
                    window.location.href = '/index.html';
                }, 2000);
            } catch (error) {
                showToast(error.message, true);
                closeModal(deleteAccountModal);
            }
        });


        // --- INITIAL LOAD ---
        loadProfile();
    });
</script>
</body>
</html>

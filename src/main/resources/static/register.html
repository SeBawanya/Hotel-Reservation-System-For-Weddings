<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Golden Palm</title>
  <link rel="icon" href="images/LinkedinArtboard 1.png" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen py-12">
<div class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg border border-slate-200">
  <div class="text-center mb-8">
    <a href="index.html">
      <img src="images/LinkedinArtboard 3.png" alt="Golden-Palm Logo" class="h-16 mx-auto">
    </a>
    <h1 class="text-2xl font-bold text-slate-800 mt-4">Create Your Account</h1>
    <p class="text-slate-500">Join us to start planning your dream event.</p>
  </div>

  <!-- Registration Form -->
  <form id="register-form" class="space-y-4">
    <div>
      <label for="name" class="block text-sm font-medium text-slate-600 mb-1">Full Name</label>
      <input type="text" id="name" name="name" class="w-full border border-slate-300 rounded-lg shadow-sm py-2 px-3 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" required>
    </div>
    <div>
      <label for="email" class="block text-sm font-medium text-slate-600 mb-1">Email Address</label>
      <input type="email" id="email" name="email" class="w-full border border-slate-300 rounded-lg shadow-sm py-2 px-3 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" required>
    </div>
    <div>
      <label for="password" class="block text-sm font-medium text-slate-600 mb-1">Password</label>
      <input type="password" id="password" name="password" class="w-full border border-slate-300 rounded-lg shadow-sm py-2 px-3 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" required>
    </div>
    <div id="message-area" class="text-sm text-center"></div>
    <div class="pt-2">
      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-8 rounded-lg transition-transform duration-200 hover:scale-105 shadow-sm">Create Account</button>
    </div>
  </form>

  <div class="text-center mt-6 text-sm">
    <p class="text-slate-500">
      Already have an account? <a href="login.html" class="font-semibold text-amber-600 hover:underline">Sign In</a>
    </p>
  </div>
</div>

<script>
  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const messageArea = document.getElementById('message-area');
    messageArea.textContent = '';

    const customerData = {
      name: form.name.value,
      email: form.email.value,
      password: form.password.value,
    };

    try {
      const response = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(customerData)
      });

      const result = await response.json();

      if (response.ok) {
        messageArea.innerHTML = `<p class="text-green-600 font-semibold">Registration successful! Redirecting to login...</p>`;
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      } else {
        messageArea.innerHTML = `<p class="text-red-500 font-semibold">${result.message || 'Registration failed.'}</p>`;
      }
    } catch (error) {
      messageArea.innerHTML = `<p class="text-red-500 font-semibold">An error occurred. Please try again.</p>`;
    }
  });
</script>
</body>
</html>
